openapi: 3.0.3

info:
  title: Notification System API
  version: 1.0.0
  description: |
    Accepts notifications for SMS, email and push, delivers them through an
    external provider and reports their status.

    **Accepted means stored.** A `201` or `202` says the notification is
    committed to the database. Delivery happens asynchronously; follow it with
    `GET /notifications/{id}` or `GET /batches/{id}`.

    **Idempotency.** Send an `Idempotency-Key` header (or the
    `idempotency_key` body field) with create requests. The same key with the
    same body returns the original result with `200` and
    `Idempotent-Replayed: true`; the same key with a different body is a `409`.

    **Correlation.** Every response carries `X-Correlation-ID`. Send your own
    value to tie the request, the worker logs and the provider call together.

    Every response in this document is checked against the real API by the
    test suite (`tests/Feature/Api/ContractTest.php`).

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Notifications
  - name: Batches
  - name: Templates
  - name: Observability

paths:
  /notifications:
    post:
      tags: [Notifications]
      summary: Create a notification
      operationId: createNotification
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationInput"
            examples:
              sms:
                summary: High-priority SMS
                value:
                  channel: sms
                  recipient: "+905551234567"
                  content: Your verification code is 482913
                  priority: high
              scheduled:
                summary: Scheduled push
                value:
                  channel: push
                  recipient: fcm-device-token-abc123
                  content: The sale starts now
                  scheduled_at: "2026-12-01T09:00:00+03:00"
              template:
                summary: From a template
                value:
                  channel: sms
                  recipient: "+905551234567"
                  template: order-shipped
                  variables:
                    name: Caner
                    order: 1042
      responses:
        "201":
          description: Accepted and stored. Status is `queued`, or `scheduled` when `scheduled_at` was given.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationEnvelope"
        "200":
          description: The idempotency key matched an earlier request; this is the notification that request created.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationEnvelope"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    get:
      tags: [Notifications]
      summary: List notifications
      description: Newest first, with cursor pagination. Follow `meta.next_cursor` until it is null.
      operationId: listNotifications
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/Status"
        - name: channel
          in: query
          schema:
            $ref: "#/components/schemas/Channel"
        - name: priority
          in: query
          schema:
            $ref: "#/components/schemas/Priority"
        - name: batch_id
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Created at or after this time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Created at or before this time.
          schema:
            type: string
            format: date-time
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: One page of notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /notifications/batch:
    post:
      tags: [Batches]
      summary: Create up to 1000 notifications
      description: |
        All or nothing: if any item is invalid nothing is stored and each
        problem is reported under its index (`notifications.17.recipient`).

        Items may carry their own `idempotency_key`. An item whose key already
        exists is not created again; it is returned with `duplicate: true`
        and the id of the existing notification.
      operationId: createBatch
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notifications]
              properties:
                notifications:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    $ref: "#/components/schemas/NotificationInput"
            example:
              notifications:
                - channel: sms
                  recipient: "+905551234567"
                  content: Flash sale, 50% off today
                  priority: low
                - channel: email
                  recipient: user@example.com
                  content: Flash sale, 50% off today
                  priority: low
      responses:
        "202":
          description: Accepted and stored.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchAcceptedEnvelope"
        "200":
          description: The batch idempotency key matched an earlier request. Lists the notifications that request created.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchAcceptedEnvelope"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /notifications/{id}:
    get:
      tags: [Notifications]
      summary: Get a notification with its delivery attempts
      operationId: getNotification
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: The notification. `delivery_attempts` lists every call made to the provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"

  /notifications/{id}/cancel:
    post:
      tags: [Notifications]
      summary: Cancel a notification that has not been sent
      description: Possible while the notification is `scheduled`, `queued` or `retrying`. A job already in the queue for it is dropped by the worker.
      operationId: cancelNotification
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/WrongStatus"

  /notifications/{id}/retry:
    post:
      tags: [Notifications]
      summary: Retry a failed notification
      description: Puts a `failed` notification back in the queue with a fresh attempt budget.
      operationId: retryNotification
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: Queued again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/WrongStatus"

  /batches/{id}:
    get:
      tags: [Batches]
      summary: Get the status of a batch
      operationId: getBatch
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          description: Counts by status. List the notifications with `GET /notifications?batch_id=`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchSummaryEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"

  /batches/{id}/cancel:
    post:
      tags: [Batches]
      summary: Cancel everything in a batch that has not been sent
      operationId: cancelBatch
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          description: The summary after cancelling, with the number cancelled by this call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchSummaryEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"

  /templates:
    post:
      tags: [Templates]
      summary: Create a template
      description: Placeholders are written as `{{ name }}`. A template may be bound to one channel.
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
            example:
              name: order-shipped
              channel: sms
              body: "Hi {{ name }}, order {{ order }} is on its way."
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    get:
      tags: [Templates]
      summary: List templates
      operationId: listTemplates
      responses:
        "200":
          description: All templates, by name.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Template"

  /templates/{name}:
    get:
      tags: [Templates]
      summary: Get a template
      operationId: getTemplate
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"

  /health:
    get:
      tags: [Observability]
      summary: Health check
      description: |
        `ok`: everything works. `degraded`: the API accepts requests but
        workers or the sweeper are not running, so nothing is being delivered
        (still `200`, accepted notifications are safe). `down`: MySQL or Redis
        is unreachable (`503`).
      operationId: health
      responses:
        "200":
          description: ok or degraded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /metrics:
    get:
      tags: [Observability]
      summary: Real-time metrics
      description: Queue depth, success and failure rates and latency. The same data is exposed for Prometheus at `http://localhost:8080/metrics`.
      operationId: metrics
      responses:
        "200":
          description: A snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsEnvelope"

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Makes the request safe to repeat. Up to 255 characters, case-sensitive.
      schema:
        type: string
        maxLength: 255
      example: order-42-shipped
    CorrelationId:
      name: X-Correlation-ID
      in: header
      description: Your own identifier for this request (letters, digits, `.`, `_`, `:`, `-`; up to 64). Generated when absent.
      schema:
        type: string
        maxLength: 64
    NotificationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BatchId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    IdempotentReplayed:
      description: "`true` when the response repeats the result of an earlier request with the same idempotency key."
      schema:
        type: string
        enum: ["true", "false"]
    CorrelationId:
      description: The correlation id of this request.
      schema:
        type: string

  responses:
    ValidationFailed:
      description: The request is invalid. Nothing was stored.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
          example:
            message: The given data was invalid.
            errors:
              recipient:
                - The recipient must be a phone number in E.164 format, for example +905551234567.
    IdempotencyConflict:
      description: The idempotency key was already used with a different request body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WrongStatus:
      description: The notification is not in a status that allows this action.
      content:
        application/json:
          schema:
            type: object
            required: [message, status]
            properties:
              message:
                type: string
              status:
                $ref: "#/components/schemas/Status"
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Channel:
      type: string
      enum: [sms, email, push]

    Priority:
      type: string
      enum: [high, normal, low]

    Status:
      type: string
      description: |
        `scheduled` waits for its time, `queued` waits for a worker,
        `processing` is being sent, `retrying` waits for its next attempt,
        `sent`, `failed` and `cancelled` are final.
      enum: [scheduled, queued, processing, retrying, sent, failed, cancelled]

    NotificationInput:
      type: object
      required: [channel, recipient]
      description: Give either `content` or `template` (with `variables`).
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        recipient:
          type: string
          description: "sms: E.164 phone number. email: address. push: device token (8 to 255 characters)."
        content:
          type: string
          description: |
            sms: at most 3 segments (GSM-7: 160 characters, or 153 per segment
            when split; any character outside the GSM alphabet, such as
            Turkish `ş` or an emoji, switches to UCS-2: 70, or 67 per
            segment). email: 100000 characters. push: 1024 characters.
        template:
          type: string
          description: Name of a template to render instead of `content`.
        variables:
          type: object
          additionalProperties: true
          description: Values for the template's placeholders.
        priority:
          allOf:
            - $ref: "#/components/schemas/Priority"
          default: normal
        scheduled_at:
          type: string
          format: date-time
          description: Deliver at this time instead of immediately. Must be in the future, at most 365 days ahead.
        idempotency_key:
          type: string
          maxLength: 255
          description: Same meaning as the `Idempotency-Key` header, which takes precedence.

    Notification:
      type: object
      required:
        - id
        - batch_id
        - channel
        - priority
        - recipient
        - content
        - status
        - attempts
        - max_attempts
        - provider_message_id
        - last_error
        - correlation_id
        - scheduled_at
        - next_attempt_at
        - expires_at
        - sent_at
        - failed_at
        - cancelled_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
          nullable: true
        channel:
          $ref: "#/components/schemas/Channel"
        priority:
          $ref: "#/components/schemas/Priority"
        recipient:
          type: string
        content:
          type: string
        status:
          $ref: "#/components/schemas/Status"
        attempts:
          type: integer
          description: Calls made to the provider so far. Waiting (rate limit, open circuit, provider throttling) is not counted.
        max_attempts:
          type: integer
        provider_message_id:
          type: string
          nullable: true
        last_error:
          type: string
          nullable: true
        correlation_id:
          type: string
          nullable: true
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        next_attempt_at:
          type: string
          format: date-time
          nullable: true
          description: When a scheduled or retrying notification becomes due.
        expires_at:
          type: string
          format: date-time
          description: A notification not delivered by then fails as expired.
        sent_at:
          type: string
          format: date-time
          nullable: true
        failed_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        delivery_attempts:
          type: array
          description: Only on `GET /notifications/{id}`.
          items:
            $ref: "#/components/schemas/DeliveryAttempt"

    DeliveryAttempt:
      type: object
      required: [attempt, outcome, http_status, latency_ms, error, at]
      properties:
        attempt:
          type: integer
        outcome:
          type: string
          description: "`accepted` (2xx), `retryable` (5xx, timeout), `throttled` (429) or `permanent` (other 4xx)."
          enum: [accepted, retryable, throttled, permanent]
        http_status:
          type: integer
          nullable: true
        latency_ms:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true
        at:
          type: string
          format: date-time

    NotificationEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Notification"

    NotificationPage:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        links:
          type: object
          required: [first, last, prev, next]
          properties:
            first:
              type: string
              nullable: true
            last:
              type: string
              nullable: true
            prev:
              type: string
              nullable: true
            next:
              type: string
              nullable: true
        meta:
          type: object
          required: [path, per_page, next_cursor, prev_cursor]
          properties:
            path:
              type: string
            per_page:
              type: integer
            next_cursor:
              type: string
              nullable: true
            prev_cursor:
              type: string
              nullable: true

    BatchAcceptedEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [batch_id, created, duplicates, notifications]
          properties:
            batch_id:
              type: string
              format: uuid
            created:
              type: integer
              description: Notifications created by this batch.
            duplicates:
              type: integer
              description: Items whose idempotency key already existed.
            notifications:
              type: array
              items:
                type: object
                required: [index, id, status, duplicate]
                properties:
                  index:
                    type: integer
                    description: Position of the item in the request.
                  id:
                    type: string
                    format: uuid
                  status:
                    $ref: "#/components/schemas/Status"
                  duplicate:
                    type: boolean

    BatchSummaryEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, total, statuses, finished, created_at]
          properties:
            id:
              type: string
              format: uuid
            total:
              type: integer
            statuses:
              type: object
              description: Number of notifications in each status.
              required: [scheduled, queued, processing, retrying, sent, failed, cancelled]
              properties:
                scheduled:
                  type: integer
                queued:
                  type: integer
                processing:
                  type: integer
                retrying:
                  type: integer
                sent:
                  type: integer
                failed:
                  type: integer
                cancelled:
                  type: integer
            finished:
              type: boolean
              description: True when no notification is waiting or in flight.
            created_at:
              type: string
              format: date-time
            cancelled:
              type: integer
              description: Only on cancel; notifications cancelled by this call.

    TemplateInput:
      type: object
      required: [name, body]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{1,99}$"
        channel:
          allOf:
            - $ref: "#/components/schemas/Channel"
          nullable: true
          description: Restricts the template to one channel.
        body:
          type: string

    Template:
      type: object
      required: [name, channel, body, variables, created_at]
      properties:
        name:
          type: string
        channel:
          type: string
          nullable: true
          enum: [sms, email, push, null]
        body:
          type: string
        variables:
          type: array
          description: Placeholders found in the body.
          items:
            type: string
        created_at:
          type: string
          format: date-time

    TemplateEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Template"

    Health:
      type: object
      required: [status, checks, circuits, time]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        checks:
          type: object
          required: [database, redis, workers, sweeper]
          properties:
            database:
              $ref: "#/components/schemas/HealthCheck"
            redis:
              $ref: "#/components/schemas/HealthCheck"
            workers:
              $ref: "#/components/schemas/HealthCheck"
            sweeper:
              $ref: "#/components/schemas/HealthCheck"
        circuits:
          type: object
          description: Circuit breaker state per channel.
          additionalProperties:
            type: string
            enum: [closed, half_open, open]
        time:
          type: string
          format: date-time

    HealthCheck:
      type: object
      required: [status]
      properties:
        status:
          type: string
        error:
          type: string
        supervisors:
          type: integer
        last_sweep_seconds_ago:
          type: integer

    MetricsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [queues, notifications, delivery, latency_ms, rate_limits, circuits, generated_at]
          properties:
            queues:
              type: object
              required: [depth, by_queue]
              properties:
                depth:
                  type: integer
                  description: Jobs pending, delayed or being processed, all queues.
                by_queue:
                  type: object
                  additionalProperties:
                    type: object
                    required: [pending, delayed, reserved, total]
                    properties:
                      pending:
                        type: integer
                      delayed:
                        type: integer
                      reserved:
                        type: integer
                      total:
                        type: integer
            notifications:
              type: object
              description: Notifications currently in each status.
              additionalProperties:
                type: integer
            delivery:
              type: object
              required: [last_minute, last_5_minutes]
              properties:
                last_minute:
                  $ref: "#/components/schemas/DeliveryRates"
                last_5_minutes:
                  $ref: "#/components/schemas/DeliveryRates"
            latency_ms:
              type: object
              required: [provider, end_to_end]
              properties:
                provider:
                  $ref: "#/components/schemas/Percentiles"
                end_to_end:
                  $ref: "#/components/schemas/Percentiles"
            rate_limits:
              type: object
              additionalProperties:
                type: object
                required: [limit_per_second, slot_interval_ms]
                properties:
                  limit_per_second:
                    type: integer
                  slot_interval_ms:
                    type: number
            circuits:
              type: object
              additionalProperties:
                type: string
                enum: [closed, half_open, open]
            generated_at:
              type: string
              format: date-time

    DeliveryRates:
      type: object
      required: [accepted, retryable, throttled, permanent, attempts, success_rate, failure_rate]
      properties:
        accepted:
          type: integer
        retryable:
          type: integer
        throttled:
          type: integer
        permanent:
          type: integer
        attempts:
          type: integer
        success_rate:
          type: number
          nullable: true
          description: accepted / attempts; null when there were no attempts.
        failure_rate:
          type: number
          nullable: true
          description: (retryable + permanent) / attempts. Throttling is the provider pacing us, not a failure.

    Percentiles:
      type: object
      required: [count, p50, p95, p99]
      properties:
        count:
          type: integer
        p50:
          type: number
          nullable: true
        p95:
          type: number
          nullable: true
        p99:
          type: number
          nullable: true

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          description: Messages per field. Batch items use `notifications.<index>.<field>`.
          additionalProperties:
            type: array
            items:
              type: string
