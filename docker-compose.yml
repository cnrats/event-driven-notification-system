name: notification-system

# Every PHP role runs the same image; only the command differs.
x-php: &php
  build:
    context: .
    target: app
  image: notification-system:local
  env_file: docker/app.env
  restart: unless-stopped

x-after-migrations: &after-migrations
  app:
    condition: service_healthy

services:
  # REST API. Applies migrations on start, so no manual step is needed.
  app:
    <<: *php
    environment:
      RUN_MIGRATIONS: "1"
      OTEL_SERVICE_NAME: notification-api
    ports:
      - "8080:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Queue workers: one strict-priority pool and one fairness pool per channel.
  horizon:
    <<: *php
    command: ["php", "artisan", "horizon"]
    environment:
      # Pool sizes can be overridden from the shell, e.g. `make demo-scale`.
      WORKERS_PER_CHANNEL: ${WORKERS_PER_CHANNEL:-4}
      FAIR_WORKERS_PER_CHANNEL: ${FAIR_WORKERS_PER_CHANNEL:-1}
      OTEL_SERVICE_NAME: notification-worker
    depends_on: *after-migrations
    volumes:
      # `make demo` runs the scenarios here and writes its measurements out.
      - ./docs/results:/app/docs/results
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    # Horizon drains in-flight jobs on SIGTERM; give it longer than the job timeout.
    stop_signal: SIGTERM
    stop_grace_period: 40s

  # Promotes due (scheduled / retrying) notifications and recovers stranded ones.
  sweeper:
    <<: *php
    command: ["php", "artisan", "notifications:sweep"]
    depends_on: *after-migrations
    stop_grace_period: 10s

  # WebSocket server for real-time status updates; watch it on
  # http://localhost:8080/live
  reverb:
    <<: *php
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8085:8080"
    depends_on:
      redis:
        condition: service_healthy

  # Stand-in for the external provider. Same contract as the brief
  # (POST {to, channel, content} -> 202 {messageId, status, timestamp}),
  # plus fault injection and arrival statistics for the scenarios.
  mock-provider:
    <<: *php
    command: ["frankenphp", "php-server", "--root", "/app/mock-provider", "--listen", ":9000"]
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:9000/__admin/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: notifications
      MYSQL_USER: notifications
      MYSQL_PASSWORD: notifications
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -unotifications -pnotifications --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  # Ready-made dashboard at http://localhost:3000 (no login).
  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/notifications.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Traces at http://localhost:16686 (OTLP in, in-memory storage).
  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  # API documentation at http://localhost:8081
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.18.2
    restart: unless-stopped
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./docs/openapi.yaml:/spec/openapi.yaml:ro
    ports:
      - "8081:8080"

volumes:
  mysql-data:
  redis-data:
